name: Bump Firmware Version on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [PolyKybd]

permissions:
  contents: write

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    concurrency:
      group: bump-version-PolyKybd
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: PolyKybd
          # PAT (Contents: write) whose identity is on the PolyKybd ruleset
          # bypass list. GITHUB_TOKEN cannot push to PolyKybd because the
          # ruleset requires changes go through a pull request (GH013).
          token: ${{ secrets.BUMP_PAT }}

      - name: Determine bump type from PR labels
        id: bump_type
        # Label names reach the script through the ENVIRONMENT, never by being
        # interpolated into its text. A GitHub label may contain a single
        # quote, which in the old `LABELS='${{ ... }}'` form closed the shell
        # string and let the rest of the name run as commands. Applying a label
        # needs write access, which already allows more than this would buy, so
        # this is defence in depth rather than a closed hole -- but the safe
        # form costs nothing.
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q '"bump:major"'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"bump:minor"'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"bump:protocol"'; then
            echo "type=protocol" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version in config.h
        # Same rule as above: the bump type is read from the environment rather
        # than pasted into the Python source. It can only be one of four
        # literals this workflow itself wrote, so nothing is exploitable here --
        # but with this there is no `${{ }}` left inside any `run:` body, which
        # makes the file safe by inspection instead of by tracing each value.
        env:
          BUMP_TYPE: ${{ steps.bump_type.outputs.type }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re

          path = "keyboards/polykybd/config.h"
          with open(path) as f:
              content = f.read()

          m = re.search(r'#define FW_VERSION "(\d+)\.(\d+)\.(\d+)"', content)
          major, minor, patch = int(m.group(1)), int(m.group(2)), int(m.group(3))

          m_proto = re.search(r'#define PROTOCOL_VERSION (\d+)', content)
          proto = int(m_proto.group(1)) if m_proto else 1

          bump = os.environ["BUMP_TYPE"]
          if bump == "major":
              major += 1; minor = 0; patch = 0
          elif bump == "minor":
              minor += 1; patch = 0
          elif bump == "protocol":
              proto += 1
          else:
              patch += 1

          content = re.sub(
              r'#define FW_VERSION "\d+\.\d+\.\d+"',
              f'#define FW_VERSION "{major}.{minor}.{patch}"',
              content
          )
          if m_proto:
              content = re.sub(
                  r'#define PROTOCOL_VERSION \d+',
                  f'#define PROTOCOL_VERSION {proto}',
                  content
              )

          with open(path, "w") as f:
              f.write(content)

          print(f"Firmware bumped to {major}.{minor}.{patch} (protocol {proto})")
          PYEOF

      - name: Commit and push
        run: |
          VERSION=$(sed -n 's/^#define FW_VERSION "\([^"]*\)".*/\1/p' keyboards/polykybd/config.h)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keyboards/polykybd/config.h
          git diff --cached --quiet || git commit -m "chore: bump firmware version to ${VERSION} [skip ci]"
          git push
