name: Bump Firmware Version on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [PolyKybd]

permissions:
  contents: write
  pull-requests: read

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    concurrency:
      group: bump-version-PolyKybd
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          ref: PolyKybd
          # PAT (Contents: write) whose identity is on the PolyKybd ruleset
          # bypass list. GITHUB_TOKEN cannot push to PolyKybd because the
          # ruleset requires changes go through a pull request (GH013).
          token: ${{ secrets.BUMP_PAT }}
          # Enough history to reach the last commit that changed FW_VERSION.
          fetch-depth: 200

      # GitHub keeps one running and ONE pending job per concurrency group: a
      # third merge while a bump runs replaces the pending job, and that PR's
      # increase was lost. So a run does not bump for its own PR alone. It
      # applies the increase of EVERY PR merged into PolyKybd since the version
      # last changed, in merge order. A dropped run is covered by the next one.
      # Same fix as PolyKybdHost#718.
      #
      # The anchor is the newest first-parent commit that changed the
      # FW_VERSION line: this workflow's own bump commit, or a hand-made
      # version PR such as #367. Nothing below it is counted again. A PR that
      # merges while this job runs makes the push below fail (the branch
      # moved), and the next run counts it.
      #
      # `bump:none` is tested FIRST and wins over every other label. A PR
      # carrying both it and a real bump label is contradictory, and the safe
      # reading of a contradiction is "do not move the version". A change that
      # cannot alter the firmware image should not move FW_VERSION: every bump
      # commit widens the delta that keyboards/polykybd/tools/
      # require_fwapply_run.py has to prove harmless before a release may
      # publish.
      - name: Bump version for every PR merged since the version last changed
        id: bump
        # Values reach the script through the environment, never by being
        # pasted into its text (qmk_firmware#251, HIL-10 in
        # polykybd-ctnd/docs/SECURITY_AUDIT.md).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re
          import subprocess
          import sys
          import time

          repo = os.environ["REPO"]
          path = "keyboards/polykybd/config.h"

          def git(*args):
              return subprocess.run(["git", *args], check=True,
                                    capture_output=True, text=True).stdout

          def api(endpoint, attempts=3):
              """GET through gh, retrying a transient failure with backoff."""
              for i in range(attempts):
                  res = subprocess.run(["gh", "api", endpoint],
                                       capture_output=True, text=True)
                  if res.returncode == 0:
                      return json.loads(res.stdout)
                  print(f"gh api {endpoint} failed (attempt {i + 1}/{attempts}): "
                        f"{res.stderr.strip()}")
                  if i + 1 < attempts:
                      time.sleep(5 * 2 ** i)
              sys.exit(f"gh api {endpoint} kept failing; re-run this job.")

          def merged_pr(sha):
              """The PR merged into PolyKybd that produced this commit, or None."""
              for pr in api(f"repos/{repo}/commits/{sha}/pulls"):
                  if pr.get("merged_at") and pr["base"]["ref"] == "PolyKybd":
                      return pr
              return None

          def fw_version(rev):
              """FW_VERSION in config.h at `rev`, or None if unreadable."""
              res = subprocess.run(["git", "show", f"{rev}:{path}"],
                                   capture_output=True, text=True)
              m = re.search(r'#define FW_VERSION "([^"]+)"', res.stdout)
              return m.group(1) if res.returncode == 0 and m else None

          # The anchor is the newest first-parent commit whose FW_VERSION VALUE
          # differs from its parent's. `git log -G` alone would also match a
          # commit that only reformats the line or edits a comment on it.
          anchor = ""
          for sha in git("log", "--first-parent", "--format=%H", "--", path).split():
              now, before = fw_version(sha), fw_version(f"{sha}^1")
              if now is not None and before is not None and now != before:
                  anchor = sha
                  break
          if not anchor:
              sys.exit("No commit in the fetched history changed FW_VERSION, so "
                       "the PRs to count are unknown. Set the version by hand in a "
                       "PR labelled bump:none, then re-run this job.")
          shas = git("rev-list", "--first-parent", f"{anchor}..HEAD").split()

          pending, seen = [], set()
          for sha in shas:
              pr = merged_pr(sha)
              if pr is not None and pr["number"] not in seen:
                  seen.add(pr["number"])
                  pending.append(pr)
          pending.reverse()  # merge order
          print(f"Anchor {anchor[:10]}; {len(pending)} merged PR(s) since.")

          with open(path) as f:
              content = f.read()
          m = re.search(r'#define FW_VERSION "(\d+)\.(\d+)\.(\d+)"', content)
          major, minor, patch = int(m.group(1)), int(m.group(2)), int(m.group(3))
          m_proto = re.search(r'#define PROTOCOL_VERSION (\d+)', content)
          proto = int(m_proto.group(1)) if m_proto else 1

          applied = []
          for pr in pending:
              labels = {lab["name"] for lab in pr.get("labels", [])}
              if "bump:none" in labels:
                  kind = "none"
              elif "bump:major" in labels:
                  major += 1; minor = 0; patch = 0; kind = "major"
              elif "bump:minor" in labels:
                  minor += 1; patch = 0; kind = "minor"
              elif "bump:protocol" in labels:
                  proto += 1; kind = "protocol"
              else:
                  patch += 1; kind = "patch"
              applied.append(f"#{pr['number']} ({kind})")
              print(f"#{pr['number']}: {kind} -> {major}.{minor}.{patch} (protocol {proto})")

          content = re.sub(r'#define FW_VERSION "\d+\.\d+\.\d+"',
                           f'#define FW_VERSION "{major}.{minor}.{patch}"', content)
          if m_proto:
              content = re.sub(r'#define PROTOCOL_VERSION \d+',
                               f'#define PROTOCOL_VERSION {proto}', content)
          with open(path, "w") as f:
              f.write(content)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"prs={', '.join(applied) or 'none'}\n")
          print(f"Firmware at {major}.{minor}.{patch} (protocol {proto})")
          PYEOF

      - name: Commit and push
        env:
          BUMPED_PRS: ${{ steps.bump.outputs.prs }}
        run: |
          VERSION=$(sed -n 's/^#define FW_VERSION "\([^"]*\)".*/\1/p' keyboards/polykybd/config.h)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keyboards/polykybd/config.h
          if git diff --cached --quiet; then
            echo "Nothing to bump."
            exit 0
          fi
          git commit -m "chore: bump firmware version to ${VERSION} [skip ci]" \
                     -m "For ${BUMPED_PRS}."
          git push
