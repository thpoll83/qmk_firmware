name: J-Bot Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write # PR reactions use the issues API
  checks: read

concurrency:
  group: jbot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # GitHub gives fork PRs no secrets, so the review credentials would be empty there.
    # Skip drafts and Dependabot as well.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pinned to the commit of tag v0 (2026-10-04). This action's action.yml
      # still runs the image ghcr.io/pgup-ai/jbot-review:latest, so the image
      # itself is not pinned by this SHA.
      - uses: pgup-ai/jbot-review-action@134542a97c6088aa3f42e62dbad575908606132c # v0
        with:
          # Codex: a ChatGPT Plus/Pro `codex login`. CODEX_AUTH_JSON is the whole
          # ~/.codex/auth.json. Set JBOT_REVIEW_MODEL to a google/... id to go
          # back to Gemini without editing this file.
          model: ${{ vars.JBOT_REVIEW_MODEL || 'codex/default' }}
          codex-auth: ${{ secrets.CODEX_AUTH_JSON }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
