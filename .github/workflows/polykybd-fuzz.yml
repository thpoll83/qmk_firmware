# Runs the libFuzzer harnesses of keyboards/polykybd/dev/fuzz/ on demand only:
# - Actions tab -> "PolyKybd fuzz" -> "Run workflow": choose the branch, the
#   target (or "all") and the run time per target.
# - On a PR: add the label "fuzz". Each target runs for 60 s on the PR's code.
#   Remove and add the label again to run it on a later push.
# The googletest replay of the corpus (make test:polykybd_fuzz_replay) still
# runs on every PR in polykybd-unit-test.yml.
# A crash input is uploaded as an artifact; dev/fuzz/README.md says what to do
# with it.
name: PolyKybd fuzz

permissions:
  contents: read

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      target:
        description: 'Fuzz target'
        type: choice
        default: all
        options: [all, overlay_roi, prc_report, fontpack, iconlib, emjdict]
      seconds:
        description: 'Run time per target, in seconds'
        type: number
        default: 300

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'fuzz') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One target when the manual run names one, else all five.
        target: ${{ fromJSON((inputs.target && inputs.target != 'all') && format('["{0}"]', inputs.target) || '["overlay_roi","prc_report","fontpack","iconlib","emjdict"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Install clang and the sanitizer runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 libclang-rt-18-dev

      - name: Build the fuzzer
        working-directory: keyboards/polykybd/dev/fuzz
        run: make CC=clang-18 build/fuzz_${{ matrix.target }}

      - name: Run the fuzzer
        working-directory: keyboards/polykybd/dev/fuzz
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || 60 }}
        run: make CC=clang-18 run-${{ matrix.target }} FUZZ_SECONDS="$FUZZ_SECONDS"

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: keyboards/polykybd/dev/fuzz/build/artifacts_${{ matrix.target }}/
          if-no-files-found: ignore
