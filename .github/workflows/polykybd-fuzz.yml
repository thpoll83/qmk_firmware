# Runs the libFuzzer harnesses of keyboards/polykybd/dev/fuzz/:
# - On a PR that changes a fuzzed parser, the harnesses or this file (the
#   paths: list below): every target for 60 s, in parallel with the other CI
#   jobs. A PR that changes none of these files does not run it.
# - Actions tab -> "PolyKybd fuzz" -> "Run workflow": choose the branch, the
#   target (or "all") and the run time per target, up to about 5 h 45 min (the
#   job limit is 360 min, GitHub's maximum).
# - Every Wednesday and Sunday at 01:43 UTC: every target for 5 h on PolyKybd.
# Manual and scheduled runs restore each target's corpus from the previous run
# (actions/cache) and save it at the end, so a long run continues where the
# last one stopped. PR runs restore it but do not save it.
# The googletest replay of the corpus (make test:polykybd_fuzz_replay) still
# runs on every PR in polykybd-unit-test.yml.
# A crash input is uploaded as an artifact; dev/fuzz/README.md says what to do
# with it.
name: PolyKybd fuzz

permissions:
  contents: read

on:
  pull_request:
    # The fuzzed sources (dev/fuzz/Makefile SRC) and every header they include.
    # The header list is what `clang -MM` reports in the Makefile (HDRS); add
    # a path here when a fuzzed source starts to include a new header.
    paths:
      - 'keyboards/polykybd/dev/fuzz/**'
      - 'keyboards/polykybd/config.h'
      - 'keyboards/polykybd/fonts/gfxfont.h'
      - 'keyboards/polykybd/base/font_lookup.h'
      - 'keyboards/polykybd/base/map_codec.h'
      - 'platforms/progmem.h'
      - 'keyboards/polykybd/base/overlay.c'
      - 'keyboards/polykybd/base/overlay.h'
      - 'keyboards/polykybd/base/prc_record.c'
      - 'keyboards/polykybd/base/prc_record.h'
      - 'keyboards/polykybd/base/fontpack.c'
      - 'keyboards/polykybd/base/fontpack.h'
      - 'keyboards/polykybd/base/icon_lib.c'
      - 'keyboards/polykybd/base/icon_lib.h'
      - 'keyboards/polykybd/base/emoji_dict.c'
      - 'keyboards/polykybd/base/emoji_dict.h'
      - 'keyboards/polykybd/base/host_tutorial_plan.c'
      - 'keyboards/polykybd/base/host_tutorial_plan.h'
      - 'keyboards/polykybd/base/macro_decode.c'
      - 'keyboards/polykybd/base/macro_decode.h'
      - 'keyboards/polykybd/base/attn_guide.c'
      - 'keyboards/polykybd/base/attn_guide.h'
      - 'keyboards/polykybd/base/ai_events.c'
      - 'keyboards/polykybd/base/ai_events.h'
      - 'keyboards/polykybd/base/combo_store.h'
      - 'keyboards/polykybd/features/anim/key_attention.h'
      - 'keyboards/polykybd/lib/drivers/disp_array.h'
      - 'modules/polykybd/polymod_prc/**'
      - 'modules/polykybd/polymod_rle/**'
      - 'modules/polykybd/polymod_crc32/**'
      - '.github/workflows/polykybd-fuzz.yml'
  schedule:
    - cron: '43 1 * * 0,3'   # Sunday and Wednesday, 01:43 UTC
  workflow_dispatch:
    inputs:
      target:
        description: 'Fuzz target'
        type: choice
        default: all
        options: [all, overlay_roi, prc_report, fontpack, iconlib, emjdict, host_tut, macro_decode, attn_guide,
                  ai_events, combo_store, map_codec]
      seconds:
        description: 'Run time per target, in seconds'
        type: number
        default: 300

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    # PR runs fuzz 60 s per target; manual and scheduled runs up to 5 h.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 360 }}
    strategy:
      fail-fast: false
      matrix:
        # One target when the manual run names one, else all of them.
        target: ${{ fromJSON((inputs.target && inputs.target != 'all') && format('["{0}"]', inputs.target) || '["overlay_roi","prc_report","fontpack","iconlib","emjdict","host_tut","macro_decode","attn_guide","ai_events","combo_store","map_codec"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Install clang and the sanitizer runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 libclang-rt-18-dev

      - name: Build the fuzzer
        working-directory: keyboards/polykybd/dev/fuzz
        run: make CC=clang-18 build/fuzz_${{ matrix.target }}

      - name: Restore the corpus of the previous long run
        uses: actions/cache/restore@v6
        with:
          path: keyboards/polykybd/dev/fuzz/build/corpus_${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Run the fuzzer
        working-directory: keyboards/polykybd/dev/fuzz
        env:
          # schedule: 5 h; workflow_dispatch: the input; pull_request: 60 s.
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && 18000 || inputs.seconds || 60 }}
        run: make CC=clang-18 run-${{ matrix.target }} FUZZ_SECONDS="$FUZZ_SECONDS"

      - name: Save the corpus for the next long run
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: keyboards/polykybd/dev/fuzz/build/corpus_${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: keyboards/polykybd/dev/fuzz/build/artifacts_${{ matrix.target }}/
          if-no-files-found: ignore

  # After a scheduled run with a failed fuzz job, open one issue per target whose
  # "Run the fuzzer" step failed (label fuzz-crash), or comment on the open issue for
  # that target. A job that failed earlier (install, build, cache) is not a crash and
  # opens no issue; GitHub's failed-workflow notification still reports it.
  # A separate job, so the job that builds and runs code never gets issues: write;
  # this one checks out nothing and only reads the run's job list.
  report-crash:
    name: report fuzz crashes
    needs: fuzz
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or update one issue per failed target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create fuzz-crash --repo "$REPO" --color B60205 \
            --description "A scheduled fuzz run found a crash" 2>/dev/null || true
          failed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select((.name | startswith("fuzz ")) and any(.steps[]?; .name == "Run the fuzzer" and .conclusion == "failure")) | .name | ltrimstr("fuzz ")')
          if [ -z "$failed" ]; then echo "No fuzzer step failed (the failure was elsewhere)."; exit 0; fi
          for target in $failed; do
            title="Fuzz crash: $target"
            body="The scheduled fuzz run $RUN_URL failed on target \`$target\`.

          The crash input is the run's artifact \`fuzz-crash-$target\`. Replay it with
          \`./build/fuzz_$target <file>\` in \`keyboards/polykybd/dev/fuzz\`; what to do next is in
          that directory's README (\"When a fuzzer finds a crash\")."
            num=$(gh issue list --repo "$REPO" --state open --label fuzz-crash \
              --search "\"$title\" in:title" --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$num" ]; then
              gh issue comment "$num" --repo "$REPO" --body "Failed again: $RUN_URL"
            else
              gh issue create --repo "$REPO" --title "$title" --label fuzz-crash --body "$body"
            fi
          done
