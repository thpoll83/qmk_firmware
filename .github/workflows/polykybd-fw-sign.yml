# Sign PolyKybd firmware release assets (FW-2).
#
# For every `.bin` attached to a published release, produce a detached 64-byte
# Ed25519 signature `<name>.bin.sig` and upload it back to the release. The host
# flasher (PolyKybdHost) sends that signature with the image; the firmware
# verifies it against the embedded public key (base/fw_pubkey.h) before applying.
#
# SETUP (once): generate the keypair with keyboards/polykybd/tools/gen_signing_key.py,
# commit the regenerated base/fw_pubkey.h, and store the private seed (base64) as
# the repository secret FW_SIGNING_KEY. The private key NEVER lives in the repo.
#
# Phase A note: the firmware currently verifies in *warn-only* mode (it logs but
# does not reject unsigned/bad images), so signing is non-blocking until you flip
# FW_REQUIRE_SIGNATURE on. Run this so signed releases exist before that switch.
name: polykybd-fw-sign

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose .bin assets to sign"
        required: true

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signing deps
        run: pip install cryptography

      - name: Sign each .bin asset and upload the .sig
        env:
          GH_TOKEN: ${{ github.token }}
          FW_SIGNING_KEY: ${{ secrets.FW_SIGNING_KEY }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${FW_SIGNING_KEY:-}" ]; then
            echo "::error::FW_SIGNING_KEY secret is not set — generate a key with gen_signing_key.py and add it."
            exit 1
          fi
          mkdir -p _sign && cd _sign
          # Download only the .bin assets attached to the release.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.bin' || {
            echo "::warning::no .bin assets on release $TAG — nothing to sign"; exit 0; }
          for bin in *.bin; do
            [ -e "$bin" ] || continue
            python3 "$GITHUB_WORKSPACE/keyboards/polykybd/tools/sign_firmware.py" "$bin"
            gh release upload "$TAG" "$bin.sig" --repo "$GITHUB_REPOSITORY" --clobber
            echo "signed + uploaded $bin.sig"
          done
