name: Build and HIL Test

on:
  push:
    branches: [PolyKybd, "PolyKybd/**"]
    # A change that cannot alter the firmware should not occupy the HIL rig for
    # a full flash-and-test cycle (the rig runs one job at a time, so such a
    # push delays every real build queued behind it).
    #
    # Beyond Markdown: `scripts/` holds only publish_release.py (the release
    # publisher — nothing the build reads), `.claude/` holds skills and settings,
    # and the other workflows are not build inputs (see the note on that line).
    # A change confined to any of them cannot reach a firmware image.
    # ⚠️ Verify that stays true before adding an exclusion here: the test is
    # whether the build or the rig ever READS it, not whether it looks unrelated.
    #
    # ⚠️ The workflow runs when AT LEAST ONE changed file is included, so a mixed
    # docs+code (or workflow+code) PR still runs the gate in full — this can
    # never hide a code change behind a README or a CI edit.
    #
    # ⚠️ This is `paths`, NOT `paths-ignore`, and it has to be: the `!` negation
    # prefix works ONLY in `paths`, and the two filters cannot both be used for
    # one event. Excluding the other workflows while still verifying THIS one is
    # not expressible with `paths-ignore` at all.
    #
    # ⚠️ ORDER IS LOAD-BEARING. The last pattern that matches a path decides it:
    # a negative after a positive excludes, a positive after a negative
    # re-includes. So the leading `**` is what makes an ordinary source file
    # match, and the qmk-test.yml line MUST stay last or this workflow stops
    # verifying changes to itself.
    #
    # ⚠️ `workflow_dispatch` has no paths filter at all, so a manual run is
    # unaffected either way.
    #
    # ⚠️ If `Build firmware` / `HIL test (split72)` are ever made REQUIRED status
    # checks in branch protection, remove this: a workflow that never runs never
    # reports, and the merge button would deadlock on a docs-only PR (a *skipped
    # job* satisfies a required check; a never-started workflow does not). The
    # fix in that case is a paths-filter job feeding `if:` conditions instead.
    paths:
      - '**'
      - '!**.md'
      - '!scripts/**'
      - '!.claude/**'
      # No `uses: ./...` anywhere in this file — every action it runs is external
      # (docker://qmkfm/qmk_cli, actions/*) — so no workflow is a build input and
      # a workflow-only change cannot alter a firmware image. Deliberately scoped
      # to `workflows/` rather than all of `.github/`: if a composite action is
      # ever added under `.github/actions/` and used here, it stays outside this
      # exclusion and keeps triggering a run, which is the safe direction.
      - '!.github/workflows/**'
      # …except this file. It IS the gate, so a change to it must still be built
      # and run on the rig. Positive-after-negative re-includes; keep it LAST.
      - '.github/workflows/qmk-test.yml'
  pull_request:
    # `labeled` is NOT in GitHub's default set (opened/synchronize/reopened), and
    # without it adding the `perf` label to an open PR fires no run at all — the
    # label condition below would only ever be evaluated on the next push. The
    # normal build + HIL jobs opt out of label events (`github.event.action !=
    # 'labeled'`) so the repo's auto-labeler can't re-run the whole expensive
    # pipeline every time it tags a PR by path.
    types: [opened, synchronize, reopened, labeled]
    # Same reasoning, same ordering constraint, as the push trigger above — keep
    # the two lists identical, and keep the qmk-test.yml re-include last.
    paths:
      - '**'
      - '!**.md'
      - '!scripts/**'
      - '!.claude/**'
      - '!.github/workflows/**'
      - '.github/workflows/qmk-test.yml'
  # Manual trigger for the opt-in performance measurement below (the normal
  # build + HIL test always run; perf does not). No inputs: the baseline is moved
  # by committing the run's JSON to polykybd-ctnd, not by a workflow switch — the
  # rig's checkout is force-synced to origin/main before every run, so anything
  # written there would be discarded on the next one.
  # ⚠️ workflow_dispatch only becomes available once this file is on the DEFAULT
  # branch — it cannot be used to try the perf job out from an unmerged PR.
  workflow_dispatch:

jobs:
  build:
    name: Build firmware
    # A `labeled` event means someone (or the auto-labeler) tagged the PR; it is
    # not a code change, so there is normally nothing new to build or HIL-test,
    # and letting every auto-label re-run this pipeline is expensive.
    # `github.event.action` is null for push / workflow_dispatch, so those still
    # run normally.
    #
    # ⚠️ ONE exception: `hil-extended`, which asks for the rig's slow tier (see
    # the hil-test job). It has to start a run, because there is no other way to
    # act on it — RE-RUNNING an existing run replays the ORIGINAL event payload,
    # so a label added afterwards is invisible to `github.event.pull_request.
    # labels` and the re-run would quietly repeat the default tier. Matching on
    # `github.event.label.name` (the label just added) keeps every other label —
    # the auto-labeler's path tags, `bump:*` — excluded as before. This is also
    # what makes the `hil-extended` label behave like `perf`, whose job chain
    # starts at `build-perf` and never had this exclusion.
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == 'hil-extended'
    runs-on: ubuntu-latest
    outputs:
      split72: ${{ steps.names.outputs.split72 }}
      split72_bin: ${{ steps.names.outputs.split72_bin }}
      split72_hil_left: ${{ steps.names.outputs.split72_hil_left }}
      split72_hil_right: ${{ steps.names.outputs.split72_hil_right }}
      split42: ${{ steps.names.outputs.split42 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Shipping shape: POLYKYBD_DOOM_PACK compiles the doom easter egg's loader,
      # call tables and trigger (the engine ships separately as the flash pack —
      # doom/PACK_DESIGN.md) and pins the overlay pool at the RAM origin. The
      # release build carries the same flag, so HIL tests exactly what ships.
      # split42 stays plain (no doom port).
      - name: Build split72 (primary)
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb polykybd/split72 -km default -e POLYKYBD_DOOM_PACK=yes

      # The HID firmware-update path takes the raw RP2040 .bin (not the .uf2),
      # which the host streams over HID. objcopy the just-built .elf so the rig
      # can drive the keyboard's own update path (stage+verify) as a HIL test.
      - name: Objcopy split72 .bin (for HID firmware-update test)
        uses: docker://qmkfm/qmk_cli
        with:
          args: arm-none-eabi-objcopy -O binary .build/polykybd_split72_default.elf polykybd_split72_default.bin

      # HIL builds: same firmware but with POLYKYBD_HIL, which fixes the split
      # role at compile time per side instead of using VBUS detection. On the rig
      # both halves are USB-powered, so stock VBUS detection makes both think they
      # are master; the two identical boards are told apart only by the station,
      # which flashes the left image to the left board and the right image to the
      # right board. left = forced master, right = forced slave (usb_disconnect).
      - name: Build split72 (HIL left/master)
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb polykybd/split72 -km default -e POLYKYBD_DOOM_PACK=yes -e POLYKYBD_HIL=left -e TARGET=polykybd_split72_hil_left

      - name: Build split72 (HIL right/slave)
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb polykybd/split72 -km default -e POLYKYBD_DOOM_PACK=yes -e POLYKYBD_HIL=right -e TARGET=polykybd_split72_hil_right

      - name: Build split42
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb polykybd/split42 -km default

      - id: names
        run: |
          echo "split72=$(ls polykybd_split72_default*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "split72_bin=$(ls polykybd_split72_default*.bin 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "split72_hil_left=$(ls polykybd_split72_hil_left*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "split72_hil_right=$(ls polykybd_split72_hil_right*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "split42=$(ls polykybd_split42_default*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            *.uf2
            *.bin
          retention-days: 7

  hil-test:
    name: HIL test (split72)
    needs: build
    runs-on: [self-hosted, polykybd-ctnd]
    # --- suite tier (OPT-IN extended checks) ---------------------------------
    # Most HIL checks cost a report or two and run on every push. A few are slow
    # by nature — they wait out a 10 s idle fade, a ~14 s animation, a 450-frame
    # split-link soak and a reboot power cycle — and together they add most of a
    # minute to the gate every push pays for. Those are EXTENDED tier
    # (station/hil_tests.py TIER_EXTENDED) and are SKIPPED unless this run asks
    # for them. Three ways to ask, mirroring the perf job below:
    #   * add the `hil-extended` label to a PR — for a change big enough to want
    #     the deep checks. This starts a run by itself (the `build` job makes a
    #     deliberate exception for this one label — see its `if:`); do NOT try to
    #     pick the label up by re-running an existing run, because a re-run
    #     replays the original event payload and cannot see it,
    #   * put `[hil-extended]` in a commit message — PUSH events only
    #     (`head_commit` does not exist on a pull_request event), i.e. after a
    #     merge, which is the release-time route,
    #   * run the workflow manually (Actions -> Run workflow) — this also satisfies
    #     the perf job's condition below, so one dispatch runs the extended HIL tier
    #     AND the perf measurement. The conditions are otherwise INDEPENDENT (each
    #     opt-in drives only its own job); asking for both at once works too — both
    #     labels, or both markers in one commit message — dispatch simply needs no
    #     label bookkeeping. `perf-test` needs `hil-test`, so the two rig jobs never
    #     interleave their flashes.
    # The runner reads HIL_EXTENDED itself, so the run command stays identical
    # and the tier is visible both here and in its "[runner] suite tier:" line.
    env:
      HIL_EXTENDED: >-
        ${{ (github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'hil-extended') ||
        contains(github.event.head_commit.message, '[hil-extended]'))
        && '1' || '0' }}
    # download-artifact needs actions:read; posting the diagnostics comment needs
    # pull-requests:write. Setting permissions explicitly replaces the default set,
    # so both are listed; no other scopes are granted to the job token.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Locate station directory
        id: ctnd
        run: |
          # Use CTND_DIR env var if set; otherwise find the first candidate
          # that actually has a venv (directory existing is not enough).
          dir="${CTND_DIR:-}"
          if [ -z "$dir" ]; then
            for candidate in /opt/polykybd-ctnd "$HOME/polykybd-ctnd"; do
              if [ -f "$candidate/venv/bin/python" ]; then
                dir="$candidate"
                break
              fi
            done
          fi
          if [ -z "$dir" ]; then
            echo "ERROR: could not find a polykybd-ctnd install with a venv." >&2
            echo "Set CTND_DIR in the runner environment or run scripts/setup.sh." >&2
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Sync station to current ctnd main
        # CI runs the *installed* station copy located above, NOT a fresh checkout
        # — it relies on the rig's polykybd-update.timer to keep that copy current.
        # When that self-update lags (rig busy/offline for a while), HIL runs stale
        # station code and already-merged fixes don't apply — so the suite flakes on
        # a problem that was fixed days ago (e.g. the sustained-settle boot-burst
        # gate). Force the install to origin/main before every run so CI always
        # exercises current station code. Best-effort: a fetch/network failure logs
        # a warning and proceeds on the installed copy (config.yaml / venv / firmware
        # are untracked, so a hard checkout leaves them intact).
        run: |
          dir="${{ steps.ctnd.outputs.dir }}"
          if [ ! -d "$dir/.git" ]; then
            echo "WARNING: $dir is not a git checkout — running the installed station as-is" >&2
            exit 0
          fi
          before=$(git -C "$dir" rev-parse --short HEAD 2>/dev/null || echo none)
          req_before=$(sha1sum "$dir/requirements.txt" 2>/dev/null | cut -d' ' -f1 || true)
          if git -C "$dir" fetch --quiet origin main \
             && git -C "$dir" checkout -q -f -B main origin/main; then
            after=$(git -C "$dir" rev-parse --short HEAD)
            echo "station synced to origin/main: $before -> $after"
            req_after=$(sha1sum "$dir/requirements.txt" 2>/dev/null | cut -d' ' -f1 || true)
            if [ "$req_before" != "$req_after" ]; then
              echo "requirements.txt changed — reinstalling station deps"
              "$dir/venv/bin/pip" install -q -r "$dir/requirements.txt" \
                || echo "WARNING: pip install failed — continuing with existing deps" >&2
            fi
          else
            echo "WARNING: could not sync $dir to origin/main — running the installed station as-is" >&2
          fi

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: ${{ steps.ctnd.outputs.dir }}/firmware

      - name: Flash and test
        run: |
          cd ${{ steps.ctnd.outputs.dir }}
          set -o pipefail
          if [ "$HIL_EXTENDED" = "1" ]; then
            echo "suite tier: EXTENDED (slow checks included)"
          else
            echo "suite tier: default (add the 'hil-extended' label for the slow checks — it starts its own run)"
          fi
          # -u: unbuffered, so the log survives even if a native lib aborts the
          # process at exit (test_runner itself os._exit()s with the real code).
          venv/bin/python -u -m station.test_runner \
            --left  "firmware/${{ needs.build.outputs.split72_hil_left }}" \
            --right "firmware/${{ needs.build.outputs.split72_hil_right }}" \
            --bin   "firmware/${{ needs.build.outputs.split72_bin }}" \
            2>&1 | tee /tmp/hil-test.log

      # On failure, collect a deliberately SANITIZED snapshot for triage. This goes
      # into the job summary and a PR comment (next step), both of which can be
      # public, so it must not leak host/device identifiers. Excluded on purpose:
      #   - dmesg (kernel log: device serials, bus addresses, other-process output)
      #   - picotool -a / full picotool info (unique board id) — only a BOOTSEL count
      #   - full lsusb / lsblk — only counts of the relevant VID/PIDs
      #   - file ownership and absolute home paths (the test log is path-redacted)
      # Kept: test_runner output (per-test PASS/FAIL), how many PolyKybd devices
      # enumerated, how many RP2040s are stuck in BOOTSEL, the raw-HID node count,
      # and the downloaded firmware artifact names/sizes.
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          dir="${{ steps.ctnd.outputs.dir }}"
          poly=$(lsusb 2>/dev/null | grep -c '2021:2007' || true)
          boot=$(lsusb 2>/dev/null | grep -c '2e8a:0003' || true)
          hidraw=$(ls -1 /dev/hidraw* 2>/dev/null | wc -l | tr -d ' ' || true)
          {
            echo "## ❌ HIL test failed — rig diagnostics"
            echo ""
            echo "<details><summary>test_runner output</summary>"
            echo ""
            echo '```'
            # Redact absolute home paths so the rig's username never reaches a
            # public comment, even if some library prints a source path.
            sed -E 's#/home/[A-Za-z0-9._-]+#/home/USER#g; s#/Users/[A-Za-z0-9._-]+#/Users/USER#g' /tmp/hil-test.log 2>/dev/null \
              || echo "(no test_runner output — failed before launch)"
            echo '```'
            echo "</details>"
            echo ""
            echo "| probe | value |"
            echo "|---|---|"
            echo "| PolyKybd USB devices (2021:2007) | ${poly:-0} |"
            echo "| RP2040s in BOOTSEL (2e8a:0003) | ${boot:-0} |"
            echo "| /dev/hidraw* nodes | ${hidraw:-0} |"
            echo ""
            echo "### Firmware artifacts (name, size)"
            echo '```'
            ( cd "$dir/firmware" 2>/dev/null && ls -1sh *.uf2 2>/dev/null ) || echo "(none)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > /tmp/hil-diagnostics.md

      # Mirror the sanitized diagnostics into a PR comment so the failure cause is
      # readable via the API (and by anything watching the PR), not only on the run
      # page. pull_request events only — a push has no PR to comment on. The marker
      # lets consumers find the latest diagnostics programmatically.
      - name: Post diagnostics as PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let diag = '(diagnostics file not found — the test step failed before producing output)';
            try { diag = fs.readFileSync('/tmp/hil-diagnostics.md', 'utf8'); } catch (e) {}
            let body = '<!-- hil-diagnostics -->\n' + diag;
            const MAX = 65000;
            if (body.length > MAX) body = body.slice(0, MAX) + '\n\n…(truncated)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  # --- Performance measurement (OPT-IN) ---------------------------------------
  #
  # Not part of the normal PR gate: it flashes a *different* firmware (the
  # profiler build) and occupies the rig for a few more minutes, so it only runs
  # when asked for. Three ways to ask, each with its own scope:
  #   * add the `hil-perf` label to a PR — the way to measure a PR (needs the
  #     `labeled` event type above; the label stays on, so later pushes to that
  #     PR keep measuring),
  #   * put `[hil-perf]` in a commit message — PUSH events only. `head_commit` does
  #     not exist on a pull_request event, so this does nothing on a PR; it
  #     applies to pushes to PolyKybd branches (i.e. after merge),
  #   * run the workflow manually (Actions -> Run workflow) — only available
  #     once this file is on the default branch. A dispatch ALSO puts the HIL
  #     suite on its extended tier (hil-test's HIL_EXTENDED above), so one dispatch
  #     runs both; a push commit carrying `[hil-perf]` AND `[hil-extended]` does the
  #     same, as do both labels on a PR.
  #
  # It reports numbers and compares them against the baseline committed in the
  # polykybd-ctnd repo (perf/baselines/<board>.json). It deliberately NEVER fails
  # the check on a regression — these are wall-clock measurements on shared
  # hardware, and a flaky red check is a check people learn to ignore. Only a
  # measurement failure (wrong build flashed, device unresponsive) fails the job.
  build-perf:
    name: Build firmware (profiling)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'hil-perf') ||
      contains(github.event.head_commit.message, '[hil-perf]')
    runs-on: ubuntu-latest
    outputs:
      hil_left: ${{ steps.names.outputs.hil_left }}
      hil_right: ${{ steps.names.outputs.hil_right }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same flags as the graded HIL build (so the measurement reflects the
      # shipping shape) PLUS POLYKYBD_LOOP_PROFILE, which compiles in the
      # main-loop profiler and its on-demand HID control command (32). Without
      # that flag the command NACKs and the perf run fails fast with a clear
      # "not a POLYKYBD_LOOP_PROFILE build" message rather than reporting zeros.
      - name: Build split72 (profiling, HIL left/master)
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb polykybd/split72 -km default -e POLYKYBD_DOOM_PACK=yes -e POLYKYBD_LOOP_PROFILE=yes -e POLYKYBD_HIL=left -e TARGET=polykybd_split72_perf_hil_left

      - name: Build split72 (profiling, HIL right/slave)
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb polykybd/split72 -km default -e POLYKYBD_DOOM_PACK=yes -e POLYKYBD_LOOP_PROFILE=yes -e POLYKYBD_HIL=right -e TARGET=polykybd_split72_perf_hil_right

      - id: names
        run: |
          echo "hil_left=$(ls polykybd_split72_perf_hil_left*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "hil_right=$(ls polykybd_split72_perf_hil_right*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-perf
          path: "*_perf_hil_*.uf2"
          retention-days: 7

  perf-test:
    name: Performance measurement (split72)
    # Ordered after hil-test so the two rig jobs can't interleave their flashes.
    # `always()` so a red HIL suite doesn't skip the measurement — a perf number
    # is often exactly what explains a timing-related HIL failure. It still needs
    # its own build to have succeeded.
    needs: [build-perf, hil-test]
    if: always() && needs.build-perf.result == 'success'
    runs-on: [self-hosted, polykybd-ctnd]
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Locate station directory
        id: ctnd
        run: |
          dir="${CTND_DIR:-}"
          if [ -z "$dir" ]; then
            for candidate in /opt/polykybd-ctnd "$HOME/polykybd-ctnd"; do
              if [ -f "$candidate/venv/bin/python" ]; then
                dir="$candidate"
                break
              fi
            done
          fi
          if [ -z "$dir" ]; then
            echo "ERROR: could not find a polykybd-ctnd install with a venv." >&2
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # Same reason as the HIL job: CI runs the *installed* station copy, so pull
      # it to origin/main first or a lagging self-update timer silently measures
      # with stale harness code (and a stale baseline).
      - name: Sync station to current ctnd main
        run: |
          dir="${{ steps.ctnd.outputs.dir }}"
          if [ ! -d "$dir/.git" ]; then
            echo "WARNING: $dir is not a git checkout — running the installed station as-is" >&2
            exit 0
          fi
          git -C "$dir" fetch --quiet origin main \
            && git -C "$dir" checkout -q -f -B main origin/main \
            && echo "station synced to $(git -C "$dir" rev-parse --short HEAD)" \
            || echo "WARNING: could not sync $dir to origin/main" >&2

      - uses: actions/download-artifact@v4
        with:
          name: firmware-perf
          path: ${{ steps.ctnd.outputs.dir }}/firmware

      - name: Measure
        run: |
          cd ${{ steps.ctnd.outputs.dir }}
          set -o pipefail
          venv/bin/python -u -m station.perf_runner \
            --left  "firmware/${{ needs.build-perf.outputs.hil_left }}" \
            --right "firmware/${{ needs.build-perf.outputs.hil_right }}" \
            --label split72 \
            --json /tmp/perf-report.json \
            --markdown /tmp/perf-report.md \
            2>&1 | tee /tmp/perf-run.log

      # The JSON is what you commit to polykybd-ctnd's perf/baselines/split72.json
      # to move the baseline — there is deliberately no automatic baseline update
      # (an auto-updating baseline ratchets a slow regression in silently).
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: |
            /tmp/perf-report.json
            /tmp/perf-report.md
            /tmp/perf-run.log
          retention-days: 30

      - name: Post perf report as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('/tmp/perf-report.md', 'utf8');
            } catch (e) {
              body = '## ⏱️ Firmware performance\n\n> ❌ The perf run produced no report — see the job log.';
            }
            body = '<!-- perf-report -->\n' + body;
            const MAX = 65000;
            if (body.length > MAX) body = body.slice(0, MAX) + '\n\n…(truncated)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  # ── FW-9 signed DOOM engine-pack HIL coverage (opt-in) ─────────────────────
  # Builds a HIL image + a matching signed .plyx so the rig can exercise the
  # LOAD-time Ed25519 gate in doom_pack_load.c (accept / tampered / unsigned).
  # Opt-in like `hil-perf` (dispatch / `hil-doom` label / `[hil-doom]` commit marker)
  # because build_pack.sh is a full monolith+pack rebuild and the tests flash ~230 KB.
  #
  # ⚠️ SECURITY: this does NOT use the real FW_SIGNING_KEY (that secret is confined
  # to release.yml). It generates an EPHEMERAL keypair, bakes its pubkey into these
  # HIL images (gen_signing_key.py rewrites base/fw_pubkey.h), and signs the pack
  # with the ephemeral seed. The signature code runs against a real key — just a
  # disposable one — so the production key is never exposed to a PR-triggered run.
  # These images are throwaway (a non-shipping pubkey); only the rig ever flashes
  # them, and the next normal run reflashes the real image.
  #
  # ⚠️ DEPENDENCY: only meaningful on firmware that HAS the FW-9 load-time check
  # (qmk #243). On a tree without it the refuse tests cannot pass — apply the
  # `hil-doom` opt-in only once that has merged.
  build-doom:
    name: Build firmware + signed pack (doom FW-9)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'hil-doom') ||
      contains(github.event.head_commit.message, '[hil-doom]')
    runs-on: ubuntu-latest
    # Least privilege: this job only checks out, builds and uploads an artifact —
    # it needs no write scopes. Matches the explicit permissions the rig test jobs
    # (hil-test / perf-test / doom-test) already carry.
    permissions:
      contents: read
    outputs:
      hil_left: ${{ steps.names.outputs.hil_left }}
      hil_right: ${{ steps.names.outputs.hil_right }}
      plyx: ${{ steps.names.outputs.plyx }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Ephemeral signing key -> base/fw_pubkey.h (baked into the images below) +
      # a seed the pack is signed with. Runs on the host before the docker builds
      # so they pick up the rewritten header. cryptography is needed here and for
      # the signing step.
      - name: Generate an ephemeral signing key
        run: |
          python3 -m pip install --quiet cryptography
          python3 keyboards/polykybd/tools/gen_signing_key.py \
            --out-privkey /tmp/doom_ephemeral_key.bin \
            --out-pubkey keyboards/polykybd/base/fw_pubkey.h \
            --force
          echo "ephemeral pubkey baked into base/fw_pubkey.h"

      - name: Build split72 (doom HIL left/master)
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb polykybd/split72 -km default -e POLYKYBD_DOOM_PACK=yes -e POLYKYBD_HIL=left -e TARGET=polykybd_split72_doom_hil_left

      - name: Build split72 (doom HIL right/slave)
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb polykybd/split72 -km default -e POLYKYBD_DOOM_PACK=yes -e POLYKYBD_HIL=right -e TARGET=polykybd_split72_doom_hil_right

      # Full monolith + pack-flavour rebuild that emits the unsigned .plyx. The
      # pack's ram_base is read from the pack-flavour ELF's pinned overlay pool
      # (0x20000000), which the HIL images above share — so it passes ram-pairing
      # at load and REACHES the signature check.
      - name: Build the DOOM engine pack
        uses: docker://qmkfm/qmk_cli
        with:
          args: bash keyboards/polykybd/doom/pack/build_pack.sh

      - name: Sign the pack with the ephemeral key
        run: |
          PACK_VER=$(cat keyboards/polykybd/doom/pack/PACK_VERSION)
          PLYX="keyboards/polykybd/doom/pack/doom_pack_v${PACK_VER}.plyx"
          # build_pack.sh runs in the qmk_cli container as root, so the .plyx lands
          # root-owned in the mounted workspace; sign_doompack.py rewrites it in place,
          # which the host runner user cannot do until it takes ownership.
          sudo chown "$(id -u):$(id -g)" "$PLYX"
          before=$(stat -c%s "$PLYX")
          python3 keyboards/polykybd/tools/sign_doompack.py --privkey /tmp/doom_ephemeral_key.bin "$PLYX"
          after=$(stat -c%s "$PLYX")
          if [ "$after" -ne "$((before + 64))" ]; then
            echo "::error::signing did not append exactly 64 bytes ($before -> $after)"
            exit 1
          fi
          cp "$PLYX" "doom_pack_signed_v${PACK_VER}.plyx"
          rm -f /tmp/doom_ephemeral_key.bin
          echo "signed $PLYX ($before -> $after bytes)"

      - id: names
        run: |
          echo "hil_left=$(ls polykybd_split72_doom_hil_left*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "hil_right=$(ls polykybd_split72_doom_hil_right*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "plyx=$(ls doom_pack_signed_v*.plyx 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-doom
          path: |
            polykybd_split72_doom_hil_*.uf2
            doom_pack_signed_v*.plyx
          retention-days: 7

  doom-test:
    name: DOOM engine-pack signature (split72)
    # Ordered after hil-test so the two rig jobs can't interleave their flashes
    # (same reason as perf-test). `always()` so it still runs when hil-test was
    # skipped (a pure `doom` label does not run the build/hil-test pipeline); it
    # flashes its own doom HIL images, so it does not depend on hil-test's flash.
    needs: [build-doom, hil-test]
    if: always() && needs.build-doom.result == 'success'
    runs-on: [self-hosted, polykybd-ctnd]
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Locate station directory
        id: ctnd
        run: |
          dir="${CTND_DIR:-}"
          if [ -z "$dir" ]; then
            for candidate in /opt/polykybd-ctnd "$HOME/polykybd-ctnd"; do
              if [ -f "$candidate/venv/bin/python" ]; then
                dir="$candidate"
                break
              fi
            done
          fi
          if [ -z "$dir" ]; then
            echo "ERROR: could not find a polykybd-ctnd install with a venv." >&2
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # CI runs the INSTALLED station copy — pull it to origin/main first, or a
      # lagging self-update timer silently runs the doom set with stale harness
      # code (or without it at all, before this feature is on the rig).
      - name: Sync station to current ctnd main
        run: |
          dir="${{ steps.ctnd.outputs.dir }}"
          if [ ! -d "$dir/.git" ]; then
            echo "WARNING: $dir is not a git checkout — running the installed station as-is" >&2
            exit 0
          fi
          git -C "$dir" fetch --quiet origin main \
            && git -C "$dir" checkout -q -f -B main origin/main \
            && echo "station synced to $(git -C "$dir" rev-parse --short HEAD)" \
            || echo "WARNING: could not sync $dir to origin/main" >&2

      - uses: actions/download-artifact@v4
        with:
          name: firmware-doom
          path: ${{ steps.ctnd.outputs.dir }}/firmware

      - name: Flash and run the doom signature set
        # Pass the build-doom filenames through env vars rather than interpolating
        # ${{ }} straight into the script: the values are runner-set filenames
        # (fixed by the -e TARGET= above, not PR-controlled), but expanding them as
        # quoted shell vars keeps a metacharacter in a name from ever breaking out
        # of the string — the GitHub-recommended shape for an untrusted-looking
        # value on a self-hosted runner.
        env:
          CTND_DIR: ${{ steps.ctnd.outputs.dir }}
          HIL_LEFT: ${{ needs.build-doom.outputs.hil_left }}
          HIL_RIGHT: ${{ needs.build-doom.outputs.hil_right }}
          PLYX: ${{ needs.build-doom.outputs.plyx }}
        run: |
          cd "$CTND_DIR"
          set -o pipefail
          venv/bin/python -u -m station.test_runner \
            --left  "firmware/$HIL_LEFT" \
            --right "firmware/$HIL_RIGHT" \
            --doom \
            --plyx-valid "firmware/$PLYX" \
            2>&1 | tee /tmp/doom-test.log
