name: Build and HIL Test

on:
  push:
    branches: [PolyKeyboard, "PolyKybd/**"]
  pull_request:

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    outputs:
      split72: ${{ steps.names.outputs.split72 }}
      split72_hil_left: ${{ steps.names.outputs.split72_hil_left }}
      split72_hil_right: ${{ steps.names.outputs.split72_hil_right }}
      corne42: ${{ steps.names.outputs.corne42 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build split72 (primary)
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb handwired/polykybd/split72 -km default

      # HIL builds: same firmware but with POLYKYBD_HIL, which fixes the split
      # role at compile time per side instead of using VBUS detection. On the rig
      # both halves are USB-powered, so stock VBUS detection makes both think they
      # are master; the two identical boards are told apart only by the station,
      # which flashes the left image to the left board and the right image to the
      # right board. left = forced master, right = forced slave (usb_disconnect).
      - name: Build split72 (HIL left/master)
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb handwired/polykybd/split72 -km default -e POLYKYBD_HIL=left -e TARGET=handwired_polykybd_split72_hil_left

      - name: Build split72 (HIL right/slave)
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb handwired/polykybd/split72 -km default -e POLYKYBD_HIL=right -e TARGET=handwired_polykybd_split72_hil_right

      - name: Build corne42
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb handwired/polykybd/corne42 -km default

      - id: names
        run: |
          echo "split72=$(ls handwired_polykybd_split72_default*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "split72_hil_left=$(ls handwired_polykybd_split72_hil_left*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "split72_hil_right=$(ls handwired_polykybd_split72_hil_right*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "corne42=$(ls handwired_polykybd_corne42_default*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: "*.uf2"
          retention-days: 7

  hil-test:
    name: HIL test (split72)
    needs: build
    runs-on: [self-hosted, polykybd-ctnd]
    # download-artifact needs actions:read; the diagnostics comment needs
    # pull-requests:write. Setting permissions explicitly replaces the default
    # set, so both are listed here.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Locate station directory
        id: ctnd
        run: |
          # Use CTND_DIR env var if set; otherwise find the first candidate
          # that actually has a venv (directory existing is not enough).
          dir="${CTND_DIR:-}"
          if [ -z "$dir" ]; then
            for candidate in /opt/polykybd-ctnd "$HOME/polykybd-ctnd"; do
              if [ -f "$candidate/venv/bin/python" ]; then
                dir="$candidate"
                break
              fi
            done
          fi
          if [ -z "$dir" ]; then
            echo "ERROR: could not find a polykybd-ctnd install with a venv." >&2
            echo "Set CTND_DIR in the runner environment or run scripts/setup.sh." >&2
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: ${{ steps.ctnd.outputs.dir }}/firmware

      - name: Flash and test
        run: |
          cd ${{ steps.ctnd.outputs.dir }}
          set -o pipefail
          # -u: unbuffered, so the log survives even if a native lib aborts the
          # process at exit (test_runner itself os._exit()s with the real code).
          venv/bin/python -u -m station.test_runner \
            --left  "firmware/${{ needs.build.outputs.split72_hil_left }}" \
            --right "firmware/${{ needs.build.outputs.split72_hil_right }}" \
            2>&1 | tee /tmp/hil-test.log

      # When the flash/test step fails, surface the test_runner output plus a
      # snapshot of the rig's USB / HID / block-device / picotool state. The block
      # goes to the job Step Summary AND to /tmp/hil-diagnostics.md, which the next
      # step posts as a PR comment so the cause is visible via the API too.
      - name: Diagnostics on failure
        if: failure()
        run: |
          dir="${{ steps.ctnd.outputs.dir }}"
          {
            echo "## ❌ HIL test failed — rig diagnostics"
            echo ""
            echo "<details><summary>test_runner output</summary>"
            echo ""
            echo '```'
            cat /tmp/hil-test.log 2>/dev/null || echo "(no test_runner output captured — failed before launch)"
            echo '```'
            echo "</details>"
            echo ""
            echo "### USB devices (lsusb)"
            echo '```'
            lsusb 2>&1 || true
            echo '```'
            echo "### Raw HID interfaces (/dev/hidraw*)"
            echo '```'
            ls -l /dev/hidraw* 2>&1 || echo "(none present)"
            echo '```'
            echo "### Block devices (lsblk)"
            echo '```'
            lsblk -o NAME,LABEL,FSTYPE,SIZE,MOUNTPOINT 2>&1 || true
            echo '```'
            echo "### picotool info (RP2040 in BOOTSEL, if any)"
            echo '```'
            sudo picotool info -a 2>&1 || echo "(no RP2040 in BOOTSEL / picotool unavailable)"
            echo '```'
            echo "### Firmware artifacts downloaded"
            echo '```'
            ls -l "$dir/firmware" 2>&1 || true
            echo '```'
            echo "### Recent kernel USB log (dmesg, last 40 lines)"
            echo '```'
            dmesg 2>/dev/null | tail -n 40 || echo "(dmesg unavailable without privileges)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > /tmp/hil-diagnostics.md

      # Mirror the diagnostics into a PR comment so the failure cause is readable
      # via the API (and by anything watching the PR), not only on the run page.
      # pull_request events only — a push has no PR to comment on. The marker
      # comment lets consumers find the latest diagnostics programmatically.
      - name: Post diagnostics as PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let diag = '(diagnostics file not found — the test step failed before producing output)';
            try { diag = fs.readFileSync('/tmp/hil-diagnostics.md', 'utf8'); } catch (e) {}
            let body = '<!-- hil-diagnostics -->\n' + diag;
            const MAX = 65000;
            if (body.length > MAX) body = body.slice(0, MAX) + '\n\n…(truncated)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
