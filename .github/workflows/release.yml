name: Release

on:
  push:
    tags:
      - 'PolyKybd-fw-v*'
  # `release` events ignore [skip ci]. Release tags here land on the auto-bump
  # "[skip ci]" commit (bump-version.yml), which suppresses the tag-push trigger
  # above — so publishing the release is what reliably starts the build.
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  KB: polykybd/split72
  KM: default

jobs:
  release:
    name: Build and release firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Shipping shape is the POLYKYBD_DOOM_PACK flavour (doom/PACK_DESIGN.md):
      # the doom easter egg's loader + trigger compile in, the engine ships as a
      # separately-flashed pack, and the overlay pool is pinned at the RAM origin.
      # build_pack.sh drives everything: the monolith build (engine objects), the
      # pack-flavour firmware build (what we release — it is the LAST build, so
      # .build/ holds its artifacts), the pinned-pool invariant check, and the
      # .plyx emit. HIL builds (qmk-test.yml) carry the same flag, so the rig
      # tests exactly this shape.
      - name: Build split72 (pack flavour) + doom engine pack
        uses: docker://qmkfm/qmk_cli
        with:
          args: bash keyboards/polykybd/doom/pack/build_pack.sh

      - name: Install ARM binutils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi

      - name: Extract .bin from ELF
        run: |
          TARGET=$(echo "${{ env.KB }}" | tr '/' '_')_${{ env.KM }}
          arm-none-eabi-objcopy -O binary \
            .build/${TARGET}.elf \
            ${TARGET}.bin
          PACK_VER=$(cat keyboards/polykybd/doom/pack/PACK_VERSION)
          cp "keyboards/polykybd/doom/pack/doom_pack_v${PACK_VER}.plyx" .

      # Crafted release notes (optional): one file per tag on the unprotected
      # `release-notes` branch — release-notes/<TAG>.md, first line "# <title>",
      # the rest the body. Files are keyed by tag, so they are never overwritten
      # or deleted — the branch is an accumulating changelog archive. A missing
      # file just falls back to --generate-notes, so this step is safe if unused.
      # (Prepared by the `polykybd-github-release` skill: it writes the file to
      # the release-notes branch, then this build attaches it when the tag lands.)
      - name: Fetch crafted release notes (if any)
        id: notes
        if: github.event_name == 'release' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh api "repos/${{ github.repository }}/contents/${TAG}.md?ref=release-notes" \
               --jq '.content' 2>/dev/null | base64 -d > _release_notes.md && [ -s _release_notes.md ]; then
            TITLE=$(head -n1 _release_notes.md | sed 's/^#\s*//')
            tail -n +2 _release_notes.md | sed '/./,$!d' > _release_body.md
            {
              echo "have_notes=1"
              echo "title=$TITLE"
            } >> "$GITHUB_OUTPUT"
            echo "Using crafted notes for $TAG (title: $TITLE)."
          else
            echo "have_notes=0" >> "$GITHUB_OUTPUT"
            echo "No crafted notes on the release-notes branch for $TAG — auto-generating."
          fi

      # FW-2: sign the .bin with the project's Ed25519 key so the firmware can
      # verify image authenticity at flash time.
      #
      # This step USED to no-op when FW_SIGNING_KEY was unset, which was correct while
      # verification was warn-only. Enforcement is now ON (rules.mk:
      # -DFW_REQUIRE_SIGNATURE), so an unsigned release is no longer a soft downgrade:
      # every keyboard flashing it is refused at COMMIT and falls through to the
      # on-keycap ACCEPT/REJECT prompt. Users who meet that prompt on every official
      # release learn to press ACCEPT reflexively — which is precisely the habit FW-2
      # exists to prevent. So a real release with no key now FAILS here instead of
      # quietly shipping unsigned. Non-release builds (a workflow_dispatch smoke test
      # off a branch) still skip signing.
      - name: Sign .bin (FW-2)
        env:
          FW_SIGNING_KEY: ${{ secrets.FW_SIGNING_KEY }}
          IS_RELEASE: ${{ github.event_name == 'release' || github.ref_type == 'tag' }}
        run: |
          TARGET=$(echo "${{ env.KB }}" | tr '/' '_')_${{ env.KM }}
          if [ -z "${FW_SIGNING_KEY:-}" ]; then
            if [ "${IS_RELEASE}" = "true" ]; then
              echo "::error::FW_SIGNING_KEY is not set, but the firmware enforces signatures"
              echo "::error::(-DFW_REQUIRE_SIGNATURE). Releasing unsigned would make every keyboard"
              echo "::error::prompt for a manual ACCEPT. Set the FW_SIGNING_KEY secret and re-run."
              echo "::error::See keyboards/polykybd/tools/SIGNING.md."
              exit 1
            fi
            echo "::notice::FW_SIGNING_KEY not set - skipping signing on this non-release build."
            exit 0
          fi
          python3 -m pip install --quiet cryptography
          python3 keyboards/polykybd/tools/sign_firmware.py "${TARGET}.bin"
          # Fail loudly rather than let the release step's `[ -f ... ]` silently drop
          # the asset: a release that is meant to be signed must not ship without .sig.
          if [ ! -s "${TARGET}.bin.sig" ]; then
            echo "::error::signing reported success but produced no ${TARGET}.bin.sig"
            exit 1
          fi
          # FW-9: the .plyx is EXECUTABLE code on the same transport, so it is
          # signed with the same key — embedded in the file (a 64-byte trailer
          # over header+image), verified by the firmware at load time. An
          # unsigned .plyx is refused outright by FW_REQUIRE_SIGNATURE builds
          # (no on-keycap prompt exists for it: the load runs at idle), so a
          # release shipping one would ship a dead asset.
          PACK_VER=$(cat keyboards/polykybd/doom/pack/PACK_VERSION)
          PLYX="doom_pack_v${PACK_VER}.plyx"
          BEFORE=$(stat -c%s "${PLYX}")
          python3 keyboards/polykybd/tools/sign_doompack.py "${PLYX}"
          AFTER=$(stat -c%s "${PLYX}")
          if [ "${AFTER}" -ne $((BEFORE + 64)) ] && [ "${AFTER}" -ne "${BEFORE}" ]; then
            echo "::error::${PLYX} size moved ${BEFORE} -> ${AFTER}; expected +64 (fresh sign) or unchanged (re-sign)"
            exit 1
          fi

      # Runs on a tag push, on publishing a release, or on a manual dispatch.
      # Idempotent: creates the release if missing, otherwise (re-)uploads the
      # assets with --clobber; a create that loses a race falls back to upload.
      # The `release` trigger matters because release tags land on the auto-bump
      # "[skip ci]" commit, which suppresses the tag-push trigger. Guarded so a
      # workflow_dispatch from a branch builds as a smoke test, not a release.
      - name: Create or update GitHub Release
        if: github.event_name == 'release' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          HAVE_NOTES: ${{ steps.notes.outputs.have_notes }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          TARGET=$(echo "${{ env.KB }}" | tr '/' '_')_${{ env.KM }}
          PACK_VER=$(cat keyboards/polykybd/doom/pack/PACK_VERSION)
          ASSETS=( "${TARGET}.uf2" "${TARGET}.bin" "doom_pack_v${PACK_VER}.plyx" )
          # Include the detached signature when the Sign step produced one (FW-2).
          [ -f "${TARGET}.bin.sig" ] && ASSETS+=("${TARGET}.bin.sig")
          if [ "$HAVE_NOTES" = "1" ]; then
            NOTES_ARGS=( --title "$TITLE" --notes-file _release_body.md )
          else
            NOTES_ARGS=( --title "PolyKybd Firmware $TAG" --generate-notes )
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists — the normal path here, because release tags
            # land on the auto-bump "[skip ci]" commit, so the tag-push trigger is
            # suppressed and this workflow runs on `release: published` (the user
            # published it in the UI). Apply the crafted notes from the branch if
            # present (so the user can publish an empty release and let CI fill it),
            # then upload assets.
            if [ "$HAVE_NOTES" = "1" ]; then
              echo "Release $TAG exists — applying crafted notes + uploading assets."
              gh release edit "$TAG" --title "$TITLE" --notes-file _release_body.md
            else
              echo "Release $TAG exists — uploading assets (keeping existing notes)."
            fi
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating release $TAG (falls back to upload if a concurrent run won the create)."
            gh release create "$TAG" "${NOTES_ARGS[@]}" "${ASSETS[@]}" \
            || gh release upload "$TAG" "${ASSETS[@]}" --clobber
          fi
