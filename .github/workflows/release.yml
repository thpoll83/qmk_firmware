name: Release

on:
  push:
    tags:
      - 'PolyKybd-fw-v*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  KB: handwired/polykybd/split72
  KM: default

jobs:
  release:
    name: Build and release firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build split72
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb ${{ env.KB }} -km ${{ env.KM }}

      - name: Install ARM binutils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi

      - name: Extract .bin from ELF
        run: |
          TARGET=$(echo "${{ env.KB }}" | tr '/' '_')_${{ env.KM }}
          arm-none-eabi-objcopy -O binary \
            .build/${TARGET}.elf \
            ${TARGET}.bin

      # Idempotent: a tag push creates the release; re-running for an existing
      # release (e.g. a manual workflow_dispatch from the tag, or a re-pushed
      # tag) just (re-)uploads the assets with --clobber. Guarded to tag refs so
      # a dispatch from a branch builds as a smoke test without cutting a release.
      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          TARGET=$(echo "${{ env.KB }}" | tr '/' '_')_${{ env.KM }}
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets (clobbering duplicates)."
            gh release upload "$TAG" "${TARGET}.uf2" "${TARGET}.bin" --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" \
              --generate-notes \
              --title "PolyKybd Firmware $TAG" \
              "${TARGET}.uf2" \
              "${TARGET}.bin"
          fi
