name: Release

on:
  push:
    tags:
      - 'PolyKybd-fw-v*'
  # `release` events ignore [skip ci]. Release tags here land on the auto-bump
  # "[skip ci]" commit (bump-version.yml), which suppresses the tag-push trigger
  # above — so publishing the release is what reliably starts the build.
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  KB: polykybd/split72
  KM: default

jobs:
  release:
    name: Build and release firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Shipping shape is the POLYKYBD_DOOM_PACK flavour (doom/PACK_DESIGN.md):
      # the doom easter egg's loader + trigger compile in, the engine ships as a
      # separately-flashed pack, and the overlay pool is pinned at the RAM origin.
      # build_pack.sh drives everything: the monolith build (engine objects), the
      # pack-flavour firmware build (what we release — it is the LAST build, so
      # .build/ holds its artifacts), the pinned-pool invariant check, and the
      # .plyx emit. HIL builds (qmk-test.yml) carry the same flag, so the rig
      # tests exactly this shape.
      - name: Build split72 (pack flavour) + doom engine pack
        uses: docker://qmkfm/qmk_cli
        with:
          args: bash keyboards/polykybd/doom/pack/build_pack.sh --version 1

      - name: Install ARM binutils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi

      - name: Extract .bin from ELF
        run: |
          TARGET=$(echo "${{ env.KB }}" | tr '/' '_')_${{ env.KM }}
          arm-none-eabi-objcopy -O binary \
            .build/${TARGET}.elf \
            ${TARGET}.bin
          cp keyboards/polykybd/doom/pack/doom_pack_v1.plyx .

      # Runs on a tag push, on publishing a release, or on a manual dispatch.
      # Idempotent: creates the release if missing, otherwise (re-)uploads the
      # assets with --clobber; a create that loses a race falls back to upload.
      # The `release` trigger matters because release tags land on the auto-bump
      # "[skip ci]" commit, which suppresses the tag-push trigger. Guarded so a
      # workflow_dispatch from a branch builds as a smoke test, not a release.
      - name: Create or update GitHub Release
        if: github.event_name == 'release' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          TARGET=$(echo "${{ env.KB }}" | tr '/' '_')_${{ env.KM }}
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets (clobbering duplicates)."
            gh release upload "$TAG" "${TARGET}.uf2" "${TARGET}.bin" doom_pack_v1.plyx --clobber
          else
            echo "Creating release $TAG (falls back to upload if a concurrent run won the create)."
            gh release create "$TAG" \
              --generate-notes \
              --title "PolyKybd Firmware $TAG" \
              "${TARGET}.uf2" \
              "${TARGET}.bin" \
              doom_pack_v1.plyx \
            || gh release upload "$TAG" "${TARGET}.uf2" "${TARGET}.bin" doom_pack_v1.plyx --clobber
          fi
