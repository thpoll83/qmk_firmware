# PolyKybd per-keycap pixel fonts — single source of truth for font generation.
#
# Edit this file, then regenerate the headers:
#     python3 fonts/generate_fonts.py        (see fonts/README.md)
# Do NOT hand-edit base/fonts/generated/*.h — they are produced from this file.
#
# The `fonts:` list is ORDERED and the order is load-bearing: list order ==
# ALL_FONTS[] priority.  Glyph lookup scans ALL_FONTS front-to-back, so when two
# entries' codepoint ranges overlap the FIRST one wins.  Categories only decide
# which generated header a font's data lands in — they do NOT affect priority.

# Named font files (paths relative to this keyboard directory). Fetch them with
# fonts/dl-fonts.sh before generating.
sources:
  noto-sans:           fonts/noto-sans/NotoSans-Regular.ttf
  noto-sans-hebrew:    fonts/Noto_Sans_Hebrew/static/NotoSansHebrew-Medium.ttf
  noto-sans-jp:        fonts/noto-sans-jp/NotoSansJP-Regular.ttf
  noto-serif-kr:       fonts/noto-serif-kr/NotoSerifKR-Medium.otf
  noto-sans-arabic:    fonts/noto-sans-arabic/static/NotoSansArabic/NotoSansArabic-Regular.ttf
  noto-sans-devanagari: fonts/noto-sans-devanagari/NotoSansDevanagari-Regular.ttf
  noto-sans-bengali:   fonts/noto-sans-bengali/NotoSansBengali-Regular.ttf
  noto-sans-telugu:    fonts/noto-sans-telugu/NotoSansTelugu-Regular.ttf
  noto-sans-tamil:     fonts/noto-sans-tamil/NotoSansTamil-Regular.ttf
  noto-sans-thai:      fonts/noto-sans-thai/NotoSansThai-Regular.ttf
  noto-sans-georgian:  fonts/noto-sans-georgian/NotoSansGeorgian-Regular.ttf
  noto-sans-armenian:  fonts/noto-sans-armenian/NotoSansArmenian-Regular.ttf
  noto-sans-tc:        fonts/noto-sans-tc/NotoSansTC-Regular.ttf
  noto-sans-ethiopic:  fonts/noto-sans-ethiopic/NotoSansEthiopic-Regular.ttf
  noto-emoji:          fonts/Noto_Emoji/static/NotoEmoji-Medium.ttf
  noto-cemoji:         fonts/Noto_CEmoji/NotoColorEmoji-Regular.ttf
  noto-sans-symbols:   fonts/Noto_Sans_Symbols/static/NotoSansSymbols-Regular.ttf
  noto-sans-symbols2:  fonts/Noto_Sans_Symbols_2/NotoSansSymbols2-Regular.ttf
  noto-sans-math:      fonts/Noto_Sans_Math/NotoSansMath-Regular.ttf
  noto-sans-canadian-aboriginal: fonts/noto-sans-canadian-aboriginal/NotoSansCanadianAboriginal-Regular.ttf
  noto-sans-cherokee:  fonts/noto-sans-cherokee/NotoSansCherokee-Regular.ttf

# The composed index header that the firmware includes (base/fonts/<output>).
index:
  output: gfx_used_fonts.h
  # Headers #included by the index in addition to the per-category ones. Their
  # fonts are either added to ALL_FONTS via prepend_fonts (gfx_icons.h) or used
  # directly elsewhere (FreeSansBold24pt7b.h is intentionally NOT in ALL_FONTS).
  extra_includes:
    - gfx_icons.h
    - FreeSansBold24pt7b.h
  # Fonts inserted at the FRONT of ALL_FONTS, before the generated ones.
  prepend_fonts:
    - IconsFont
  # Extra fonts kept RESIDENT (compiled in, never in the font pack) even though
  # their category is otherwise packed. These supply UI *chrome* that must render
  # with no pack present. NotoSansSymbols2 Arrows (U+2B6F–2BA0, ~0.9 KB) draws the
  # Tab / Enter(Return) / Undo / Redo / refresh-circle / nav arrow-stop key icons
  # (ARROWS_* in lang/named_glyphs.h, used by poly_keymap.c + status_oled.c).
  # The Technical/Technical2 + Settings/World/Brightness fonts keep the modifier
  # legends (Ctrl ⎈ / Alt ⎇ / GUI ⌘ / Option ⌥ / Del ⌦ / Backspace ⌫ / Esc ⎋ /
  # PrintScreen ⎙) and the on-keyboard menu chrome (settings ⚙, language 🌐, and
  # the settings-layer brightness moons 🌑–🌖) legible with NO pack flashed — so a
  # freshly-flashed keyboard can navigate its own UI before any font pack lands.
  # The Util / Hyper / Meh fonts add the utility-layer legends (screenshot 🖼,
  # calculator 🖩, my-computer 🖳, clipboard) and the Hyper 💫 / Meh 🐐 modifier
  # symbols; GuiKey adds the GUI/Super ❖ legend. ~6 KB total; the rest of these
  # categories stay in the pack.
  resident_fonts:
    - NotoSansSymbols2_Regular_Arrows_20pt16b
    - NotoSansSymbols2_Regular_Technical2_20pt16b
    - NotoSansSymbols_Regular_Technical_20pt16b
    - NotoSansSymbols2_Regular_GuiKey_20pt16b
    - NotoSansSymbols2_Regular_Util_20pt16b
    - NotoEmoji_Medium_Settings_20pt16b
    - NotoEmoji_Medium_World_20pt16b
    - NotoEmoji_Medium_Brightness_16pt16b
    - NotoEmoji_Medium_Hyper_18pt16b
    - NotoEmoji_Medium_Meh_20pt16b
    - NotoEmoji_Medium_EmjLayer_20pt16b
  # Fonts appended to the END of the external-flash font pack that are generated
  # OUTSIDE the main fonts.yaml pipeline (so they have no `fonts:` entry). Each is
  # parsed from its standalone header. The language-layer country flags
  # (gen-lang-fonts.sh, codepoints 0xE000+idx) ship here instead of resident, so
  # the ~63 KB flag font leaves the firmware image; render_lang_flag_key() draws
  # them via g_all_fonts and falls back to the xx-YY label when no pack is present.
  pack_extra_fonts:
    - {symbol: NotoColorEmoji_Regular_LangFlags_20pt7b, header: flag_fonts.h}

# Split-pack bundles: the non-resident pack is also emitted as one PlyF per
# script family, laid out in fixed sector-aligned slots inside the 2 MB fontpack
# window (behind a 4 KB directory). The host flashes only the bundles that are
# missing/stale on the device (per-bundle content_version in the GET_ID reply).
# `list` order == slot order in flash == version order in the GET_ID block, so it
# is APPEND-ONLY (a bundle's index is its on-wire id). Put the bundle most likely
# to grow (emoji) last with slot_kb: rest so its growth never shifts the others.
# Every non-resident font must map to exactly one bundle (by category, or by
# pack_extra symbol for the standalone flags); generate_fonts.py fails the build
# if a bundle overflows its slot. Slot sizes are KB, multiples of 4 (sector).
bundles:
  layout_version: 1
  region_kb: 2048          # 2 MB fontpack window (FW_RESOURCE_OFFSET .. +2 MB)
  dir_sectors: 1           # 4 KB directory sector at the region base
  # NB: the `latin` category is resident: true (compiled into the firmware, the
  # functional minimum so the keyboard renders ASCII/Cyrillic/Greek with NO pack),
  # so it is NOT a bundle here — only non-resident pack fonts get bundles.
  list:
    - {id: symbol,   slot_kb: 96,   categories: [symbols]}
    - {id: mideast,  slot_kb: 96,   categories: [arabic, hebrew, ethiopic]}
    - {id: syllabic, slot_kb: 96,   categories: [canadian, cherokee]}
    - {id: asia,     slot_kb: 128,  categories: [jp, kr, bopomofo, devanagari,
                                                 bengali, telugu, tamil, thai,
                                                 vietnamese, georgian, armenian]}
    - {id: flags,    slot_kb: 128,  pack_extra: [NotoColorEmoji_Regular_LangFlags_20pt7b]}
    - {id: emoji,    slot_kb: rest, categories: [emoji, emoji_fig]}

# Each category -> one generated header, with defaults inherited by its fonts.
categories:
  latin:
    output: latin_fonts.h
    # resident == compiled into the firmware image (the "functional minimum"),
    # NOT shipped in the external-flash font pack. The latin category covers
    # ASCII + Latin-extended + Cyrillic + Greek keycaps, so the keyboard stays
    # usable for those layouts with no pack present. See base/fontpack.h and
    # fonts/fontpack.py. (IconsFont — index.prepend_fonts — is resident too.)
    resident: true
    defaults: {source: noto-sans, size: 14}
  hebrew:
    output: hebrew_fonts.h
    defaults: {source: noto-sans-hebrew, size: 22, weight: 400}
  jp:
    output: jp_fonts.h
    defaults: {source: noto-sans-jp, size: 15, weight: 400}
  kr:
    output: kr_fonts.h
    defaults: {source: noto-serif-kr, size: 21, weight: 400}
  arabic:
    output: arabic_fonts.h
    defaults: {source: noto-sans-arabic, size: 16, render_height: 40}
  devanagari:
    output: devanagari_fonts.h
    defaults: {source: noto-sans-devanagari, size: 16, render_height: 40}
  bengali:
    output: bengali_fonts.h
    defaults: {source: noto-sans-bengali, size: 16, render_height: 40}
  telugu:
    output: telugu_fonts.h
    defaults: {source: noto-sans-telugu, size: 16, render_height: 40}
  tamil:
    output: tamil_fonts.h
    defaults: {source: noto-sans-tamil, size: 14, render_height: 40}
  thai:
    output: thai_fonts.h
    defaults: {source: noto-sans-thai, size: 16, render_height: 40}
  georgian:
    output: georgian_fonts.h
    defaults: {source: noto-sans-georgian, size: 17, render_height: 40, weight: 500}
  armenian:
    output: armenian_fonts.h
    defaults: {source: noto-sans-armenian, size: 16, render_height: 40, weight: 500}
  bopomofo:
    output: bopomofo_fonts.h
    defaults: {source: noto-sans-tc, size: 16, render_height: 40, weight: 500}
  vietnamese:
    output: vietnamese_fonts.h
    defaults: {source: noto-sans, size: 16, render_height: 40}
  ethiopic:
    output: ethiopic_fonts.h
    defaults: {source: noto-sans-ethiopic, size: 16, render_height: 40}
  canadian:
    output: canadian_fonts.h
    defaults: {source: noto-sans-canadian-aboriginal, size: 16, render_height: 40}
  cherokee:
    output: cherokee_fonts.h
    defaults: {source: noto-sans-cherokee, size: 13, render_height: 40}
  symbols:
    output: symbol_fonts.h
    defaults: {source: noto-sans-symbols2, size: 20, render_height: 50}
  emoji:
    output: emoji_fonts.h
    # Default: monochrome NotoEmoji line-art (the original).  Most emoji read
    # best as the crisp b/w glyphs; only the full-body "puppet" human figures
    # (see the emoji_fig category) get the colour treatment.
    defaults: {source: noto-emoji, size: 20, render_height: 50}
  emoji_fig:
    output: emoji_fig_fonts.h
    # Colour override for NotoEmoji's full-body human figures, which it draws as
    # abstract round-head "finger puppet" shapes / solid silhouettes that read
    # poorly.  These are the "col4" recipe from the visual study: NotoColorEmoji
    # composited+dithered, per-glyph auto-levels (-N), inverted to an outlined
    # icon (-I), crisp interior edges (-E), clean 1px outline (-O1), at full
    # keycap height (r40, yadvance 48 -> y=0..40, zero clip).  Sports/activity
    # figures are intentionally NOT here — their b/w line-art is cleaner.  These
    # entries are listed FIRST in `fonts:` so they win priority over the b/w
    # emoji glyphs that also cover these codepoints.
    defaults: {source: noto-cemoji, size: 20, render_height: 40, yadvance: 48,
               grayscale: true, dither: fs, normalize: true,
               invert: true, edge: true, outline: 1, bits: 32}

# ORDERED list == ALL_FONTS[] priority. Each entry inherits its category
# defaults; any field below overrides them. `bits: 32` marks SMP (>U+FFFF)
# ranges so the real codepoint is written into the struct (no PUA shift).
fonts:
  - {category: latin, variant: _Base_, ranges: [[0x20, 0x7e]]}
  # --- Colour overrides for NotoEmoji's "puppet" human figures. Listed FIRST so
  # they win priority over the b/w emoji glyphs covering the same codepoints.
  # Explicit set chosen by the user; each range is a contiguous all-colour run.
  # Solid-silhouette figures (family, pregnant, hugging, lotus, climbing...) and
  # the sports/activity line-art stay b/w (their b/w line-art is cleaner). ---
  - {category: emoji_fig, variant: _PpSanta_,    normalize: false, invert: false, ranges: [[0x1f385, 0x1f385]]}  # 🎅 filled (white beard reads better un-inverted)
  - {category: emoji_fig, variant: _PpPeopleA_,  ranges: [[0x1f466, 0x1f469]]}  # 👦👧👨👩
  # Couples are full-body; render them as "portraits": ~1.6x size (r64, capped to
  # 72 wide) positioned so the heads sit at the top and the legs clip below the
  # 40px keycap (yadvance 67 -> glyph top at y=0, bottom at 64).  Upper ~62% shows.
  - {category: emoji_fig, variant: _PpCouples_,  render_height: 64, max_width: 72, yadvance: 67, xshift: -12, ranges: [[0x1f46b, 0x1f46d]]}  # 👫👬👭 portrait (xshift -12 cancels the 2-space prefix push)
  - {category: emoji_fig, variant: _PpRoles_,    ranges: [[0x1f46e, 0x1f478]]}  # 👮..👸 roles (👹 ogre stays b/w)
  - {category: emoji_fig, variant: _PpInfoGuardDance_, ranges: [[0x1f481, 0x1f483]]} # 💁💂💃
  - {category: emoji_fig, variant: _PpGroom_,    ranges: [[0x1f486, 0x1f487]]}  # 💆💇
  - {category: emoji_fig, variant: _PpCoupleHeart_, ranges: [[0x1f491, 0x1f491]]} # 💑
  - {category: emoji_fig, variant: _PpGestA_,    ranges: [[0x1f645, 0x1f647]]}  # 🙅🙆🙇
  - {category: emoji_fig, variant: _PpRaiseHand_, ranges: [[0x1f64b, 0x1f64b]]} # 🙋
  - {category: emoji_fig, variant: _PpFrownPout_, ranges: [[0x1f64d, 0x1f64e]]} # 🙍🙎
  - {category: emoji_fig, variant: _PpFacepalm_, ranges: [[0x1f926, 0x1f926]]}  # 🤦
  - {category: emoji_fig, variant: _PpRoyals_,   ranges: [[0x1f934, 0x1f937]]}  # 🤴🤵🤶🤷 prince, tuxedo, Mrs Claus, shrug (contiguous)
  - {category: emoji_fig, variant: _PpHeroes_,   ranges: [[0x1f9b8, 0x1f9b9]]}  # 🦸🦹
  - {category: emoji_fig, variant: _PpPersons_,  ranges: [[0x1f9d1, 0x1f9d6]]}  # 🧑..🧖  (🧗🧘 stay b/w)
  - {category: emoji_fig, variant: _PpFantasy_,  ranges: [[0x1f9d9, 0x1f9df]]}  # 🧙..🧟 mage..zombie
  - {category: emoji, variant: _ToolsBMP_, ranges: [[0x2692, 0x269c]]}
  - {category: emoji, variant: _EmjHandsBMP2_, ranges: [[0x270a, 0x270d]], note: 'Cat 1: BMP hand gestures.  ☝☞ (0x261D-0x261E, Symbols2) are merged into _SymBmp1_ (see "Symbols"). ✊✋✌✍ (0x270A-0x270D, NotoEmoji) stay separate; the Symbols2 ranges are split around this island.'}
  - {category: symbols, variant: _SymBmp1_, ranges: [[0x25ac, 0x25ac], [0x2600, 0x2647]], note: 'Symbols2 BMP fonts — full contiguous Misc-Symbols + Dingbats coverage (0x25AC-0x27BF), DISJOINT ranges split around the interleaved NotoEmoji islands (Zodiac 0x2648-53, ToolsBMP 0x2692-9C, TravelBMP2 0x26F0-F5, TravelBMP 0x2708, HandsBMP2 0x270A-0D). Overlap-free, no prefix trick. Replace SymbolsAndShapes / EmjWeatherBMP(2) / EmjHandsBMP / Chess / DiamondCut / EmjSnowflake / EmjSportsBMP / EmjHeart (all NotoSansSymbols2). Glyphs in the gaps (I-Ching, road signs, …) are rendered but simply not referenced by any emoji category. _SymBmp1_ 0x25AC, 0x2600-0x2647   _SymBmp2_ 0x2654-0x2691   _SymBmp6_ 0x269D-0x26EF _SymBmp3_ 0x26F6-0x2707           _SymBmp5_ 0x2709          _SymBmp4_ 0x270E-0x27BF Tools/alchemical 0x2692-0x269C (⚒⚓⚔⚕⚖⚗⚙⚛⚜) are absent from NotoSansSymbols2 — sourced from NotoEmoji.'}
  - {category: symbols, variant: _SymBmp2_, ranges: [[0x2654, 0x2691]]}
  - {category: symbols, variant: _SymBmp3_, ranges: [[0x26f6, 0x2707]]}
  - {category: symbols, variant: _SymBmp4_, ranges: [[0x270e, 0x27bf]]}
  - {category: symbols, variant: _SymBmp5_, ranges: [[0x2709, 0x2709]]}
  - {category: symbols, variant: _SymBmp6_, ranges: [[0x269d, 0x26ef]]}
  - {category: emoji, variant: _Zodiac_, ranges: [[0x2648, 0x2653]], note: 'Cat 6 addition: zodiac signs ♈-♓ (BMP 0x2648-0x2653, NotoEmoji). Stays separate (NotoEmoji); the Symbols2 ranges _SymBmp1_/_SymBmp2_ are split around this island.'}
  - {category: emoji, variant: _EmjLayer_, bits: 32, ranges: [[0x1f600, 0x1f600]], note: 'Grinning face 😀 (U+1F600) — the emoji-layer indicator on the default layer (TO(_EMJ) in keycode_helper.c). Kept resident (index.resident_fonts) so it renders with no pack; also present in _Emojis0_ but resident wins.'}
  - {category: latin, variant: _LatinExtB_, render_height: 44, ranges: [[0x180, 0x24f]], note: 'Latin Extended-B (0x0180-0x024F) — emoji-layer "Latin" tab (cat 11). Latin Extended-A (0x0100-0x017E) is already covered by _SupAndExtA_ above.'}
  - {category: latin, variant: _Schwa_, render_height: 44, ranges: [[0x259, 0x259]], note: 'Latin small letter schwa (U+0259) for Azerbaijani az-AZ — sits just past the _LatinExtB_ range (IPA Extensions). Capital schwa Ə U+018F is already in _LatinExtB_.'}
  - {category: latin, variant: _SupAndExtA_, render_height: 44, ranges: [[0xa1, 0x17e]]}
  - {category: emoji, variant: _EmjTravelBMP_, ranges: [[0x2708, 0x2708]], note: 'Cat 8: travel — BMP 0x2708 + SMP 0x1F680-0x1F6C5 (extended to include shower/bath/transit)'}
  - {category: latin, variant: _CurrencySigns_, ranges: [[0x20aa, 0x20ac], [0x20b1, 0x20b1], [0x20b4, 0x20b4], [0x20bc, 0x20bd], [0x2116, 0x2116]], note: 'Added ₱ peso (20B1, en-PH/tl-PH), ₼ manat (20BC, az-AZ), ₽ ruble (20BD, ru-RU).'}
  - {category: emoji, variant: _Hyper_, size: 18, bits: 32, ranges: [[0x1f4ab, 0x1f4ab]]}
  - {category: emoji, variant: _Meh_, bits: 32, ranges: [[0x1f410, 0x1f410]]}
  - {category: emoji, variant: _Settings_, bits: 32, ranges: [[0x1f527, 0x1f527]]}
  - {category: emoji, variant: _World_, bits: 32, ranges: [[0x1f310, 0x1f310]]}
  - {category: symbols, variant: _Arrows_, ranges: [[0x2b6f, 0x2b73], [0x2b7e, 0x2b7e], [0x2b8c, 0x2b8c], [0x2b8e, 0x2b8e], [0x2ba0, 0x2ba0]]}
  - {category: symbols, variant: _Technical2_, ranges: [[0x2318, 0x2318], [0x2325, 0x2326], [0x232b, 0x232b]]}
  - {category: symbols, variant: _Technical_, source: noto-sans-symbols, ranges: [[0x2387, 0x2388], [0x238b, 0x238b], [0x2399, 0x2399]]}
  - {category: symbols, variant: _GuiKey_, ranges: [[0x2756, 0x2756]], note: 'GUI/Super key legend ❖ (DINGBAT_BLACK_DIA_X, U+2756). Kept resident (index.resident_fonts) so the GUI modifier renders with no pack; also present in _SymBmp4_ but resident wins.'}
  - {category: emoji, variant: _ClipCpy_, size: 18, bits: 32, ranges: [[0x1f4cb, 0x1f4cb]]}
  - {category: emoji, variant: _FileOpen_, size: 14, bits: 32, ranges: [[0x1f4c2, 0x1f4c2]]}
  - {category: symbols, variant: _Util_, bits: 32, ranges: [[0x1f568, 0x1f56a], [0x1f5a9, 0x1f5ab], [0x1f5b3, 0x1f5bc], [0x1f5ca, 0x1f5ca]]}
  - {category: emoji, variant: _Brightness_, size: 16, bits: 32, ranges: [[0x1f311, 0x1f318]]}
  - {category: emoji, variant: _Find_, size: 18, bits: 32, ranges: [[0x1f50e, 0x1f50e]]}
  - {category: emoji, variant: _Lock_, size: 18, bits: 32, ranges: [[0x1f512, 0x1f512]]}
  - {category: emoji, variant: _Note_, size: 12, bits: 32, ranges: [[0x1f4dd, 0x1f4dd]]}
  # 0x1F5D4 (🗔 ICON_APP_SWITCH, window+cursor) extends the window-management family
  # downward by one; renders at the same size/treatment as minimize/maximize/window.
  # Extending _Window_'s range in place adds a glyph without moving _Window_ in the
  # priority order, so no other font's global ALL_FONTS index shifts. The two NEW
  # wave-B hint fonts (_WinSwitch_, _WordArrows_) are appended at the END of this
  # list (see below) so they take the highest indices and shift nothing ahead of
  # them — keeping the change isolated to the symbol bundle (+ the trailing flags).
  - {category: symbols, variant: _Window_, size: 18, bits: 32, ranges: [[0x1f5d4, 0x1f5db]]}
  - {category: emoji, variant: _AI_, bits: 32, ranges: [[0x1f300, 0x1f300]]}
  - {category: emoji, variant: _Emojis0_, bits: 32, ranges: [[0x1f600, 0x1f64f]]}
  - {category: emoji, variant: _Light_, bits: 32, ranges: [[0x1f4a1, 0x1f4a1]]}
  - {category: emoji, variant: _Emojis2_, bits: 32, ranges: [[0x1f912, 0x1f919]]}
  - {category: jp, variant: _Cjk4e2d_, ranges: [[0x4e2d, 0x4e2d]]}
  - {category: jp, variant: _Cjk5eff_, ranges: [[0x5eff, 0x5eff]]}
  - {category: jp, variant: _Cjk96e3_, ranges: [[0x96e3, 0x96e3]]}
  - {category: jp, variant: _Cjk91cd_, ranges: [[0x91cd, 0x91cd]], note: 'Cangjie Z radical 重 U+91CD (zh-CN / zh-HK Cangjie layout).'}
  - {category: jp, variant: _KangXi_, ranges: [[0x2f00, 0x2f00], [0x2f08, 0x2f08], [0x2f17, 0x2f18], [0x2f1d, 0x2f25], [0x2f2b, 0x2f2d], [0x2f38, 0x2f3f], [0x2f47, 0x2f4a], [0x2f54, 0x2f55], [0x2f65, 0x2f65], [0x2f75, 0x2f75], [0x2fa6, 0x2fa6]]}
  - {category: emoji, variant: _EmjAnimals2_, bits: 32, ranges: [[0x1f981, 0x1f98f]], note: 'Cat 4 addition: newer animals 🦁-🦏 (Unicode 9+)'}
  - {category: emoji, variant: _EmjAnimals3_, bits: 32, ranges: [[0x1f990, 0x1f997]], note: 'Cat 4 addition: newer animals 🦐-🦗 (Unicode 10+)'}
  - {category: emoji, variant: _EmjAnimals4_, bits: 32, ranges: [[0x1f998, 0x1f9a0]], note: 'Cat 4 addition: newer animals 🦘-🦠 (Unicode 11+)'}
  - {category: emoji, variant: _EmjAnimals5_, bits: 32, ranges: [[0x1f9a1, 0x1f9ae]], note: 'Cat 4 addition: newer animals 🦡-🦭 (Unicode 12-13+)'}
