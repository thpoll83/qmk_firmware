  # Wave-B OS-aware shortcut-hint fonts, appended LAST so they take the highest
  # ALL_FONTS indices and never shift an existing font's index (only the trailing
  # pack_extra flags font moves). Both are symbol-bundle, non-resident, and overlap
  # no other range, so their low priority is irrelevant. See keycode_to_disp_overlay().
  # 0x1F5BD (🖽 ICON_WINDOW_SWITCH, tiled frame) — singleton so its first..last span
  # never reaches _Util_'s 0x1F5CA (CLIPBOARD_PASTE) and shadow it with an empty glyph.
  - {category: symbols, variant: _WinSwitch_, size: 18, bits: 32, ranges: [[0x1f5bd, 0x1f5bd]]}
  # NotoSansMath hint glyphs (none are in Symbols v1/Symbols2): dashed word-nav
  # arrows ⇠⇢ (U+21E0/21E2, ICON_WORD_LEFT/RIGHT) and the boxed-X close mark
  # ⊠ (U+22A0, ICON_CLOSE) — a lighter "close window" than the heavy ⛝ U+26DD.
  # (The 0x21E0..0x22A0 span emits ~190 empty placeholder glyphs between the three
  # real ones, like _Util_ does — negligible in the 96 KB symbol slot.)
  - {category: symbols, variant: _MathHints_, source: noto-sans-math, ranges: [[0x21e0, 0x21e0], [0x21e2, 0x21e2], [0x22a0, 0x22a0], [0x2347, 0x2348]]}
  # Wave-C: 🗣 dictation (U+1F5E3, ICON_DICTATION) for the Windows-only Win+H hint.
  # NotoSansSymbols2 has no glyph at 1F5E3 (notdef), so it is sourced from
  # NotoEmoji-Medium (mono) like the Tools/alchemical SymBmp glyphs above. Singleton
  # span (no shadowing), appended LAST so it takes the highest ALL_FONTS index and
  # shifts only the trailing flags font. Bumps the symbol bundle content_version.
